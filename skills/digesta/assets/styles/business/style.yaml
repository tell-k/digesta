# business: 白地に濃紺の見出し、ゴシック体、直線の枠。人物のイラストは出さない。社内外の会議・報告向け
name: business
description: 白地・濃紺・ゴシック体・直線の枠。キャラクターなし、ピクトグラムは単色の線画。ビジネス会議や報告向け
fonts:
  BIZUDPGothic-Regular.ttf: [bizudpgothic, BIZ UDPGothic, 400]
  BIZUDPGothic-Bold.ttf: [bizudpgothic, BIZ UDPGothic, 700]
subtitle_font: BIZ UDPGothic Bold
paper: 0xffffff
bgm_prompt: >-
  Create a 3-minute instrumental background track for a calm corporate recap video of a business meeting.
  Minimal and unobtrusive: soft felt piano chords, light electric piano, subtle warm pad. No drums, no percussion, no shaker, no claps.
  Around 65 BPM, major key, sparse slow chords in the low-mid register with long soft notes and no lead melody, steady and even from start to finish with no build-ups or drops, so narration can sit on top and the track still sounds natural when the video is played at 1.5x or 2x speed.
  Instrumental only, no vocals, no spoken words. Smooth beginning and a soft natural ending.

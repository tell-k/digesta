<!doctype html>
<!-- breeze スタイルの本編の枠(スライド部分が透明な 1920x1080)。淡いブルーグレーの地、角丸のスライド窓、白い角丸の字幕欄。#ch=1&topic=0 で章と話題を指定 -->
<html lang="ja"><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  * { box-sizing:border-box; } html,body { margin:0; background:transparent; }
  body { width:1920px; height:1080px; overflow:hidden; color:#1f2a44; font-family:"Zen Maru Gothic", sans-serif; font-weight:500; position:relative; }
  /* スライドの窓: 角丸の穴の外側を、大きな影で地の色に塗る */
  #hole { position:absolute; left:44px; top:104px; width:1344px; height:756px; border-radius:18px; box-shadow:0 0 0 2400px #f2f5fa; }
  #frame { position:absolute; left:40px; top:100px; width:1352px; height:764px; border-radius:22px; border:4px solid var(--c); }
  #top { position:absolute; left:44px; top:22px; right:44px; height:60px; display:flex; align-items:center; gap:18px; }
  #top h1 { font-size:32px; margin:0; font-weight:900; white-space:nowrap; }
  #top h1 b { color:#2f6fe4; }
  #top .dg { font-size:20px; font-weight:700; background:#ffd84d; padding:3px 16px; border-radius:999px; white-space:nowrap; }
  #steps { margin-left:auto; display:flex; gap:10px; font-size:19px; }
  #steps span { padding:5px 16px; border-radius:999px; background:#fff; color:#8b93a7; white-space:nowrap; font-weight:700; }
  #steps span.on { color:#fff; background:var(--c); }
  #side { position:absolute; left:1420px; top:104px; width:456px; height:756px; background:#fff; border-radius:22px; padding:24px 24px 0; box-shadow:0 8px 24px rgba(31,42,68,.06); }
  #side .who { display:inline-block; font-size:20px; font-weight:700; padding:2px 16px; border-radius:999px; background:var(--t); color:var(--c); }
  #side .ttl { font-size:30px; line-height:1.28; margin-top:10px; font-weight:900; }
  #side .sub { font-size:20px; color:#4a5470; line-height:1.35; margin-top:8px; }
  #side h3 { font-size:17px; margin:24px 0 6px; font-weight:700; color:#8b93a7; letter-spacing:.2em; }
  #side ul { margin:0; padding:0; }
  #side li { list-style:none; font-size:23px; line-height:1.3; padding:10px 10px 10px 48px; position:relative; color:#a3aabb; border-top:2px dashed #e1e5ee; font-weight:700; }
  #side li.done { color:#6b7590; }
  #side li.on { color:#1f2a44; background:linear-gradient(transparent 62%, #ffe27a 62%); }
  #side li::before { content:attr(data-n); position:absolute; left:4px; top:9px; width:30px; height:30px; font-size:16px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:#eef1f7; color:#8b93a7; font-weight:900; }
  #side li.done::before { background:var(--t); color:var(--c); }
  #side li.on::before { color:#fff; background:var(--c); }
  #side .icons { position:absolute; left:0; right:0; bottom:16px; display:flex; justify-content:center; gap:36px; }
  #cap { position:absolute; left:44px; top:886px; width:1832px; height:172px; background:#fff; border-radius:22px; box-shadow:0 8px 24px rgba(31,42,68,.06); }
  #cap::before { content:""; position:absolute; left:0; top:28px; bottom:28px; width:8px; border-radius:0 8px 8px 0; background:var(--c); }
</style>
<div id="hole"></div>
<div id="frame"></div>
<div id="top"><h1 id="h1"></h1><span class="dg" id="dg"></span><div id="steps"></div></div>
<div id="side"></div>
<div id="cap"></div>
<script src="pict.js"></script><script src="episode.js"></script><script src="icons.js"></script>
<script>
  const q = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  const CH = EP.chapters, ch = CH[(+q.ch || 1) - 1], topic = +q.topic || 0, pal = PAL[ch.color] || PAL.blue;
  document.documentElement.style.setProperty("--c", pal.hex);
  document.documentElement.style.setProperty("--t", pal.tint);
  document.getElementById("h1").innerHTML = `${EP.label} <b>${EP.number || ""}</b>`;
  document.getElementById("dg").textContent = EP.badge;
  document.getElementById("steps").innerHTML = CH.map((c) => `<span class="${c.n === ch.n ? "on" : ""}">${c.n} ${c.short || c.who || c.title}</span>`).join("");
  const icons = ch.topics[topic].icons || [];
  document.getElementById("side").innerHTML = `
    ${ch.who ? `<div class="who">${ch.who}</div>` : ""}
    <div class="ttl">${ch.title}</div><div class="sub">${ch.sub || ""}</div>
    <h3>TOPICS</h3>
    <ul>${ch.topics.map((t, i) => `<li data-n="${i + 1}" class="${i === topic ? "on" : i < topic ? "done" : ""}">${t.title}</li>`).join("")}</ul>
    <div class="icons">${icons.map((n) => `<i data-ico="${n}" data-s="${icons.length > 1 ? 104 : 124}" data-c="${ch.color}"></i>`).join("")}</div>`;
  document.fonts.ready.then(() => document.fonts.load('16px "Zen Maru Gothic"', "あ")).then(() => { mountIcons(); window.READY = true; });
</script>
</html>

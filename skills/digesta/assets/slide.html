<!doctype html>
<!-- 録画がない話題で、本編の枠に映すスライド(1344x756)。#ch=1&topic=0 で章と話題を指定し、cuts.yaml の slide を描く。
     どのスタイルでも使う共通の雛形。スタイルのフォルダに slide.html があれば、そちらが使われる -->
<html lang="ja"><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  * { box-sizing:border-box; } html,body { margin:0; }
  body { width:1344px; height:756px; overflow:hidden; background:var(--paper); color:var(--ink); font-family:var(--font), sans-serif; }
  #s { position:absolute; inset:0; padding:64px 80px 56px 96px; display:flex; flex-direction:column; }
  #s::before { content:""; position:absolute; left:0; top:0; bottom:0; width:20px; background:var(--c); }
  .label { align-self:flex-start; font-size:26px; font-weight:700; color:#fff; background:var(--c); padding:6px 18px; border-radius:6px; margin-bottom:22px; }
  h1 { font-size:58px; line-height:1.3; margin:0 0 34px; font-weight:700; }
  h1 mark, li mark { background:none; color:var(--c); }
  ul { margin:0; padding:0; display:flex; flex-direction:column; gap:22px; }
  li { list-style:none; font-size:38px; line-height:1.4; padding-left:44px; position:relative; }
  li::before { content:""; position:absolute; left:4px; top:.5em; width:18px; height:18px; border-radius:50%; background:var(--c); }
  .note { margin-top:auto; font-size:26px; color:var(--sub); }
  /* kind: shot(記事の画面)/ image(記事の図や gif) */
  .row { display:flex; gap:44px; flex:1; min-height:0; }
  .browser { flex:0 0 760px; height:500px; border-radius:14px; overflow:hidden; background:#fff; box-shadow:0 10px 30px rgba(31,42,68,.18); border:2px solid #dfe4ee; display:flex; flex-direction:column; }
  .bar { height:34px; flex:0 0 34px; background:#eef1f6; display:flex; align-items:center; gap:8px; padding:0 14px; }
  .bar i { width:12px; height:12px; border-radius:50%; background:#c9d0dc; }
  .bar span { margin-left:10px; font-size:16px; color:#5b6580; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .browser img { width:100%; flex:1; min-height:0; object-fit:cover; object-position:top; display:block; }
  .side { flex:1; display:flex; flex-direction:column; gap:18px; min-width:0; }
  .side h2 { font-size:36px; line-height:1.35; margin:0; font-weight:900; }
  .meta { font-size:24px; color:var(--sub, #4a5470); }
  .buzz { display:flex; flex-wrap:wrap; gap:12px; margin-top:6px; }
  .buzz span { font-size:26px; font-weight:700; padding:6px 18px; border-radius:999px; background:var(--t, #eef1f6); color:var(--c); border:2px solid var(--c); }
  .url { margin-top:18px; font-size:22px; color:var(--sub, #4a5470); word-break:break-all; }
  .url b { color:var(--c); margin-right:10px; }
  h2.ih { font-size:42px; line-height:1.3; margin:0 0 20px; font-weight:900; }
  h2.ih mark { background:none; color:var(--c); color:inherit; }
  .fig { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .fig img { max-width:100%; max-height:100%; flex:1; min-height:0; object-fit:contain; width:100%; border-radius:8px; }
  .cap { font-size:26px; margin-top:12px; text-align:center; font-weight:500; }
  .row ul { flex:0 0 40%; justify-content:center; }
  .row li { font-size:30px; }
</style>
<div id="s"></div>
<script src="episode.js"></script>
<script>
  const COLORS = { coral: "#f2665b", magenta: "#d6338a", orange: "#ee8a1c", teal: "#1f9e95", blue: "#2f7bd8", purple: "#7a5bd6", green: "#4fa35a" };
  const q = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  const ch = EP.chapters[(+q.ch || 1) - 1], tp = ch.topics[+q.topic || 0], slide = (tp.slides ? tp.slides[+q.s || 0] : tp.slide) || {};
  const root = document.documentElement.style;
  root.setProperty("--c", COLORS[ch.color] || "#2f7bd8");
  const paper = EP.slide_paper || "#ffffff";
  root.setProperty("--paper", paper);
  // 背景が濃いスタイル(ut の濃紺など)では文字を白にする。暗い文字のままだと読めない
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(paper.slice(i, i + 2), 16) / 255);
  const dark = 0.2126 * r + 0.7152 * g + 0.0722 * b < 0.5;
  root.setProperty("--ink", dark ? "#ffffff" : "#2b2f36");
  root.setProperty("--sub", dark ? "rgba(255,255,255,.7)" : "#6b7280");
  root.setProperty("--font", `"${EP.slide_font || "sans-serif"}"`);
  const kind = slide.kind || "text";
  const pts = (slide.points || []).length ? `<ul>${slide.points.map((p) => `<li>${p}</li>`).join("")}</ul>` : "";
  const label = slide.label ? `<div class="label">${slide.label}</div>` : "";
  let html;
  if (kind === "shot") {
    html = label + `<div class="row"><div class="browser"><div class="bar"><i></i><i></i><i></i><span>${slide.url || ""}</span></div><img src="../${slide.image}"></div>` +
      `<div class="side">${slide.title ? `<h2>${slide.title}</h2>` : ""}${slide.meta ? `<div class="meta">${slide.meta}</div>` : ""}` +
      `${(slide.buzz || []).length ? `<div class="buzz">${slide.buzz.map((x) => `<span>${x}</span>`).join("")}</div>` : ""}</div></div>` +
      `<div class="url"><b>URL</b>${slide.url || ""}</div>`;
  } else if (kind === "image") {
    const fig = `<div class="fig"><img id="fig" src="../${slide.image}">${slide.caption ? `<div class="cap">${slide.caption}</div>` : ""}</div>`;
    html = label + (slide.heading ? `<h2 class="ih">${slide.heading}</h2>` : "") + (pts ? `<div class="row">${fig}${pts}</div>` : fig) +
      (slide.source || slide.note ? `<div class="note">${slide.source ? "出典: " + slide.source : slide.note}</div>` : "");
  } else {
    html = label + (slide.heading ? `<h1>${slide.heading}</h1>` : "") + `<ul>${(slide.points || []).map((p) => `<li>${p}</li>`).join("")}</ul>` +
      (slide.note ? `<div class="note">${slide.note}</div>` : "");
  }
  document.getElementById("s").innerHTML = html;
  // 入りきらないときは文字を縮める
  const s = document.getElementById("s");
  for (let k = 1; k > 0.6 && s.scrollHeight > s.clientHeight + 1; k -= 0.04) s.style.fontSize = "", s.querySelectorAll("h1,li,.label,.note").forEach((el) => (el.style.zoom = k));
  document.fonts.ready.then(() => Promise.all([...document.images].map((im) => im.complete ? 0 : new Promise((r) => (im.onload = im.onerror = r))))).then(() => { window.READY = true; });
</script>
</html>

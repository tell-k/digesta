# breeze: business の部品(番号付きパネル、決定事項とネクストアクション、線画のピクトグラム)をもとに、明るく少しカジュアルにしたもの。グラレコは左 2/3 に 2×2 のパネル、右 1/3 に決定事項とネクストアクション。
# 淡いブルーグレーの地に白い角丸パネル、濃紺の文字、章ごとの明るい差し色、黄色のマーカー、丸ゴシック(Zen Maru Gothic)。社名やロゴは入れない
name: breeze
description: 淡いブルーグレーの地に白い角丸パネル。濃紺の文字に明るい差し色と黄色のマーカー、丸ゴシック。人物なし、ピクトグラムは章の色の線画に薄い色の丸。ビジネス寄りだが明るめの社内勉強会・定例向け
fonts:
  ZenMaruGothic-Regular.ttf: [zenmarugothic, Zen Maru Gothic, 400]
  ZenMaruGothic-Medium.ttf: [zenmarugothic, Zen Maru Gothic, 500]
  ZenMaruGothic-Bold.ttf: [zenmarugothic, Zen Maru Gothic, 700]
  ZenMaruGothic-Black.ttf: [zenmarugothic, Zen Maru Gothic, 900]
subtitle_font: Zen Maru Gothic Bold
paper: "0xf2f5fa"
bgm_prompt: >-
  Create a 3-minute instrumental background track for a bright, friendly recap video of an internal tech study session.
  Light and positive but not hyper: clean electric piano, plucky muted guitar, soft marimba accents, gentle bass, light shaker and soft kick.
  Around 100 BPM, major key, steady and even from start to finish with no build-ups or drops, so narration can sit on top.
  Instrumental only, no vocals. Smooth beginning and a soft natural ending.

        - start: 1388.6
          end: 1399.4
          subs:
            - [1388.74, 1392.3, '一つ注意なんですけど\NEXPLAIN ANALYZE は本当に実行します']
            - [1392.8, 1395.6, 'UPDATE とか DELETE に使うときは']
            - [1395.6, 1399.2, 'BEGIN と ROLLBACK で\N挟んでおいてください']
    - title: '質疑応答'
      icons: [question]
      clips:
        - start: 1702.3
          end: 1713.6
          subs:
            - [1702.46, 1705.8, 'Q. インデックスって\Nたくさん作ったほうがいいんですか']
